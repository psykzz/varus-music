services:

  # ── Backend (Fastify API) ────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/psykzz/varus-music-backend:latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      DATABASE_URL: file:/data/db/varus.db
      JWT_SECRET: ${JWT_SECRET:-varus-music-dev-secret-change-in-production}
      PORT: 3001
      LASTFM_API_KEY: ${LASTFM_API_KEY:-your_lastfm_api_key_here}
      MUSIC_STORAGE_PATH: /data/music
      WATCH_FOLDER: /data/watch
    volumes:
      - db_data:/data/db
      # Map storage folders to host paths so files are managed outside the container.
      # Override MUSIC_PATH / WATCH_PATH in .env to point at your own directories.
      - ${MUSIC_PATH:-./storage/music}:/data/music
      - ${WATCH_PATH:-./storage/watch}:/data/watch

  # ── Frontend (React / nginx) ─────────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/psykzz/varus-music-frontend:latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data:
